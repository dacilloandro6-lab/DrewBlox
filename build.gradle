plugins {
    id 'com.android.application' version '8.6.1'
}

android {
    namespace 'com.drewblox.classic'
    compileSdk 35

    defaultConfig {
        applicationId 'com.drewblox.classic'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
