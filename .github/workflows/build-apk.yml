
name: Build DrewBlox APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper missing. Add gradlew and gradle/wrapper files."
            exit 1
          fi

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: DrewBlox-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
