<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DrewBlox 3D — Classic World</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#8ec9ee; font-family:Arial,Helvetica,sans-serif; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:fixed; inset:0; pointer-events:none; color:white; text-shadow:1px 2px 2px #0009; }
  #brand { position:absolute; top:14px; left:14px; padding:9px 12px; background:#245f96e8; border:2px solid #d9e9f6; border-radius:5px; font-weight:900; font-size:18px; }
  #brand span { color:#ffe27a; }
  #hint { position:absolute; top:66px; left:14px; max-width:min(430px, calc(100vw - 28px)); padding:9px 12px; background:#18364fc9; border-radius:4px; font-size:13px; line-height:1.45; }
  #status { position:absolute; top:14px; right:14px; padding:9px 12px; background:#18364fc9; border-radius:4px; font-size:12px; }
  #center { position:absolute; left:50%; top:50%; width:7px; height:7px; margin:-3px; border:1px solid #fff; border-radius:50%; opacity:.7; }
  #message { position:absolute; left:50%; top:22%; transform:translateX(-50%); padding:9px 14px; border-radius:5px; background:#16344dc9; font-weight:bold; text-align:center; opacity:0; transition:opacity .2s; }
  #mobileControls { display:none; position:absolute; inset:auto 0 18px 0; padding:0 18px; justify-content:space-between; align-items:end; pointer-events:auto; }
  .pad { display:grid; grid-template-columns:52px 52px 52px; grid-template-rows:52px 52px; gap:5px; }
  .touchbtn { border:2px solid #e4edf5b8; background:#1a4779a8; color:white; border-radius:10px; font-weight:bold; font-size:19px; touch-action:none; user-select:none; }
  .touchbtn:active, .touchbtn.down { background:#4e91c8d9; }
  #up { grid-column:2; grid-row:1; } #left { grid-column:1; grid-row:2; } #down { grid-column:2; grid-row:2; } #right { grid-column:3; grid-row:2; }
  #jump { width:78px; height:78px; border-radius:50%; font-size:14px; background:#b9821dc9; }
  #reset { position:absolute; right:14px; top:64px; pointer-events:auto; border:1px solid #fff9; border-radius:4px; padding:7px 9px; color:white; background:#18364fc9; cursor:pointer; }
  @media (pointer:coarse), (max-width:760px) {
    #mobileControls { display:flex; }
    #hint { top:auto; bottom:164px; font-size:12px; max-width:calc(100vw - 28px); }
    #status { font-size:11px; }
    #center { display:none; }
  }
</style>
</head>
<body>
<div id="hud">
  <div id="brand">Drew<span>Blox</span> <small style="font-size:11px;font-weight:normal">3D TEST</small></div>
  <div id="hint">WASD / Arrow keys: move · Space: jump · Mouse: look around<br>On mobile: use the movement pad and JUMP button.</div>
  <div id="status">Loading world…</div>
  <button id="reset">Respawn</button>
  <div id="center"></div>
  <div id="message">Welcome to DrewBlox!</div>
  <div id="mobileControls">
    <div class="pad">
      <button class="touchbtn" id="up" aria-label="Move forward">▲</button>
      <button class="touchbtn" id="left" aria-label="Move left">◀</button>
      <button class="touchbtn" id="down" aria-label="Move backward">▼</button>
      <button class="touchbtn" id="right" aria-label="Move right">▶</button>
    </div>
    <button class="touchbtn" id="jump">JUMP</button>
  </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ec9ee);
scene.fog = new THREE.Fog(0x8ec9ee, 70, 180);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe8f7ff, 0x65784b, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
sun.position.set(-25, 45, 30); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
scene.add(sun);

const mat = (color, extra={}) => new THREE.MeshStandardMaterial({color, roughness:0.86, ...extra});
const grass = mat(0x5e9e50), greenTop = mat(0x6dad5c), sideMat = mat(0x4b7f40);
const base = new THREE.Mesh(new THREE.BoxGeometry(100, 2, 100), [sideMat,sideMat,greenTop,sideMat,sideMat,sideMat]);
base.position.y = -1; base.receiveShadow = true; scene.add(base);

// Classic studded baseplate: visible raised studs arranged in a grid.
const studGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.12, 12);
const studMat = mat(0x78b867);
const studs = new THREE.InstancedMesh(studGeo, studMat, 31*31);
const dummy = new THREE.Object3D(); let idx=0;
for(let x=-30;x<=30;x+=2) for(let z=-30;z<=30;z+=2) {
  dummy.position.set(x,0.075,z); dummy.rotation.set(0,0,0); dummy.updateMatrix(); studs.setMatrixAt(idx++,dummy.matrix);
}
studs.castShadow = true; studs.receiveShadow = true; scene.add(studs);

// A few simple classic block structures for scale and exploration.
function block(x,y,z,sx,sy,sz,color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), mat(color));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; scene.add(m); return m;
}
block(-8,1.5,-10,4,3,4,0xd9b64e);
block(-8,3.35,-10,2.3,0.7,2.3,0x5a9bda);
block(9,1,-8,3,2,3,0xd95d4e);
block(9,2.3,-8,2.1,0.6,2.1,0xf0c74b);
block(0,0.8,-17,8,1.6,2,0x8b8f96);
block(0,1.8,-17,8,0.35,2,0x497db4);
for(let i=0;i<5;i++) block(16+i*2,0.5+i*0.6,7,1.5,1+i*0.6,1.5,[0xd85b4c,0xe9c64d,0x5a9bd4,0x62a95a,0x9d70bd][i]);

// Blocky avatar: yellow head, blue torso, green legs, simple face.
const player = new THREE.Group(); scene.add(player);
const yellow = mat(0xffd34f), blue = mat(0x2f75c5), green = mat(0x4e9a52), skin = mat(0xffd34f), black = mat(0x20252b);
function part(parent, w,h,d, material, x,y,z) {
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z); mesh.castShadow=true; mesh.receiveShadow=true; parent.add(mesh); return mesh;
}
part(player,1.05,1.1,0.52,blue,0,1.55,0);
const head = new THREE.Group(); head.position.set(0,2.45,0); player.add(head);
part(head,0.82,0.82,0.78,yellow,0,0,0);
part(head,0.10,0.10,0.035,black,-0.19,0.09,0.402);
part(head,0.10,0.10,0.035,black,0.19,0.09,0.402);
part(head,0.23,0.045,0.04,black,0,-0.17,0.408);
const leftArm = new THREE.Group(); leftArm.position.set(-0.69,1.9,0); player.add(leftArm);
part(leftArm,0.35,0.95,0.4,yellow,0,-0.38,0);
const rightArm = new THREE.Group(); rightArm.position.set(0.69,1.9,0); player.add(rightArm);
part(rightArm,0.35,0.95,0.4,yellow,0,-0.38,0);
const leftLeg = new THREE.Group(); leftLeg.position.set(-0.28,1,0); player.add(leftLeg);
part(leftLeg,0.43,1.0,0.48,green,0,-0.48,0);
const rightLeg = new THREE.Group(); rightLeg.position.set(0.28,1,0); player.add(rightLeg);
part(rightLeg,0.43,1.0,0.48,green,0,-0.48,0);

const state = {pos:new THREE.Vector3(0,0,5), velY:0, grounded:true, yaw:0, pitch:-0.22, moving:false};
player.position.copy(state.pos);
const keys = {};
addEventListener('keydown', e=>{ keys[e.code]=true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup', e=>keys[e.code]=false);
const status = document.getElementById('status');
const message = document.getElementById('message');
let msgTimer;
function toast(text) { message.textContent=text; message.style.opacity=1; clearTimeout(msgTimer); msgTimer=setTimeout(()=>message.style.opacity=0,2200); }
toast('Welcome to DrewBlox!');

const canvas = renderer.domElement;
canvas.addEventListener('click',()=>{ if(matchMedia('(pointer:fine)').matches && document.pointerLockElement!==canvas) canvas.requestPointerLock?.(); });
document.addEventListener('mousemove',e=>{
 if(document.pointerLockElement===canvas) { state.yaw -= e.movementX*0.0025; state.pitch -= e.movementY*0.002; state.pitch=Math.max(-0.85,Math.min(0.35,state.pitch)); }
});
let touchLook=null;
canvas.addEventListener('touchstart',e=>{ if(e.touches.length && e.touches[0].clientX>innerWidth*0.35) touchLook={x:e.touches[0].clientX,y:e.touches[0].clientY,id:e.touches[0].identifier}; },{passive:true});
canvas.addEventListener('touchmove',e=>{
 if(!touchLook) return;
 for(const t of e.changedTouches) if(t.identifier===touchLook.id) {
   state.yaw -= (t.clientX-touchLook.x)*0.008;
   state.pitch -= (t.clientY-touchLook.y)*0.006;
   state.pitch=Math.max(-0.85,Math.min(0.35,state.pitch));
   touchLook.x=t.clientX; touchLook.y=t.clientY;
 }
},{passive:true});
canvas.addEventListener('touchend',e=>{for(const t of e.changedTouches) if(t.identifier===touchLook?.id) touchLook=null;},{passive:true});

const touchKeys = {};
function bindHold(id, code) {
 const el=document.getElementById(id);
 const down=e=>{e.preventDefault(); touchKeys[code]=true; el.classList.add('down');};
 const up=e=>{e.preventDefault(); touchKeys[code]=false; el.classList.remove('down');};
 el.addEventListener('pointerdown',down); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); el.addEventListener('pointerleave',up);
}
bindHold('up','KeyW'); bindHold('down','KeyS'); bindHold('left','KeyA'); bindHold('right','KeyD');
const jumpButton=document.getElementById('jump');
jumpButton.addEventListener('pointerdown',e=>{e.preventDefault(); jump(); jumpButton.classList.add('down');});
['pointerup','pointercancel','pointerleave'].forEach(ev=>jumpButton.addEventListener(ev,()=>jumpButton.classList.remove('down')));
function isDown(code) { return !!keys[code] || !!touchKeys[code]; }
function jump() { if(state.grounded) {state.velY=8.8; state.grounded=false;} }
addEventListener('keydown',e=>{if(e.code==='Space' && !e.repeat) jump();});
document.getElementById('reset').addEventListener('click',()=>{state.pos.set(0,0,5);state.velY=0;state.yaw=0;state.pitch=-0.22;toast('Respawned at the baseplate.');});

const clock = new THREE.Clock();
const camOffset = new THREE.Vector3();
function animate() {
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),0.04);
 const forward = (isDown('KeyW')||isDown('ArrowUp')?1:0) - (isDown('KeyS')||isDown('ArrowDown')?1:0);
 const strafe = (isDown('KeyD')||isDown('ArrowRight')?1:0) - (isDown('KeyA')||isDown('ArrowLeft')?1:0);
 state.moving = forward!==0 || strafe!==0;
 const speed=7.2;
 const dirForward=new THREE.Vector3(-Math.sin(state.yaw),0,-Math.cos(state.yaw));
 const dirRight=new THREE.Vector3(Math.cos(state.yaw),0,-Math.sin(state.yaw));
 const move=new THREE.Vector3().addScaledVector(dirForward,forward).addScaledVector(dirRight,strafe);
 if(move.lengthSq()>0) {
   move.normalize();
   state.pos.addScaledVector(move,speed*dt);
   player.rotation.y=Math.atan2(-move.x,-move.z);
 }
 state.pos.x=Math.max(-47,Math.min(47,state.pos.x));
 state.pos.z=Math.max(-47,Math.min(47,state.pos.z));
 state.velY-=22*dt;
 state.pos.y+=state.velY*dt;
 if(state.pos.y<=0) {state.pos.y=0;state.velY=0;state.grounded=true;}
 player.position.set(state.pos.x,state.pos.y,state.pos.z);
 const swing=state.moving && state.grounded ? Math.sin(performance.now()*0.012)*0.55 : 0;
 leftLeg.rotation.x=swing; rightLeg.rotation.x=-swing;
 leftArm.rotation.x=-swing*0.75; rightArm.rotation.x=swing*0.75;
 const target=new THREE.Vector3(state.pos.x,state.pos.y+2.1,state.pos.z);
 const distance=8.5;
 const horizontal=Math.cos(state.pitch)*distance;
 camOffset.set(Math.sin(state.yaw)*horizontal, 2.4+Math.sin(state.pitch)*distance, Math.cos(state.yaw)*horizontal);
 camera.position.copy(target).add(camOffset);
 camera.lookAt(target);
 status.textContent=`X ${state.pos.x.toFixed(1)}  ·  Z ${state.pos.z.toFixed(1)}  ·  ${state.grounded?'ON GROUND':'AIRBORNE'}`;
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
